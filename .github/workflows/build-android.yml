name: Build Pin Untangle Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project zip if present
        run: |
          if [ -f "pin-untangle-android-startio.zip" ]; then
            unzip -o pin-untangle-android-startio.zip -x ".github/*"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Configure Start.io App ID if provided
        if: ${{ vars.STARTIO_APP_ID != '' }}
        env:
          STARTIO_APP_ID: ${{ vars.STARTIO_APP_ID }}
        run: |
          node -e '
            const fs = require("fs");
            const file = "android/app/src/main/res/values/strings.xml";
            const xml = fs.readFileSync(file, "utf8");
            const updated = xml.replace(
              /<string name="startio_app_id">[^<]*<\/string>/,
              `<string name="startio_app_id">${process.env.STARTIO_APP_ID.trim()}</string>`
            );
            fs.writeFileSync(file, updated);
          '

      - name: Build web assets
        env:
          VITE_STARTIO_APP_ID: ${{ vars.STARTIO_APP_ID }}
          VITE_STARTIO_TESTING: ${{ vars.VITE_STARTIO_TESTING || 'true' }}
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Build Debug APK (installable on Android phone)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pin-untangle-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release AAB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pin-untangle-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
